version: "3.9"

services:
  mariadb:
    image: mariadb:10.11
    container_name: springai-mariadb
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root1234
      MARIADB_DATABASE: springai
      MARIADB_USER: root
      MARIADB_PASSWORD: root1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data: